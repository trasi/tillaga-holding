<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tillaga</title>
  <meta name="description" content="Tillaga is on hold.">
  <meta name="theme-color" content="#0f766e">
  <style>
    :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1220; --fg: #e5e7eb; --muted: #9ca3af; --accent: #14b8a6; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; box-sizing: border-box; padding: 24px 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 34rem; text-align: center; }
    .mark {
      width: 56px; height: 56px; border-radius: 16px; background: var(--accent);
      margin: 0 auto 24px; display: grid; place-items: center;
    }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { margin: 0 0 1rem; color: var(--muted); }
    .is { font-size: .95rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(128, 128, 128, .3); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>
        <path d="M12 8l1.2 2.8L16 12l-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2z"/>
      </svg>
    </div>
    <h1>Tillaga is on hold</h1>
    <p>The recommendation API for OTT platforms is paused for now. The project may return in the future.</p>
    <p class="is" lang="is">Tillaga er í hléi. Þjónustan er ekki í rekstri í augnablikinu en gæti snúið aftur síðar.</p>
  </main>
</body>
</html>
